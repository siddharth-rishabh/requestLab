<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RequestLab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">

    <h1 class="logo">Request<span>Lab</span></h1>

    <!-- Method + URL + Send -->
    <form class="request-bar">
      <select class="method" aria-label="HTTP method">
        <option>GET</option>
        <option>POST</option>
        <option>PUT</option>
        <option>PATCH</option>
        <option>DELETE</option>
      </select>
      <input class="url" type="url" aria-label="API URL" placeholder="https://api.example.com/v1/users">
      <button class="send" type="submit">Send</button>
    </form>

    <div class="panels">

      <!-- Request -->
      <section class="panel">
        <h2 class="panel-title">Request</h2>

        <h3 class="section-title">Headers</h3>
        <div class="header-row">
          <input class="input key" type="text" aria-label="Header name" placeholder="Key" value="Content-Type">
          <input class="input value" type="text" aria-label="Header value" placeholder="Value" value="application/json">
        </div>

        <h3 class="section-title"><label for="body">Body</label></h3>
        <textarea class="body" id="body" spellcheck="false"></textarea>
      </section>

      <!-- Response -->
      <section class="panel">
        <div class="response-top">
          <h2 class="panel-title">Response</h2>
          <div class="response-info">
            <span>Status <strong class="status">...</strong></span>
            <span>Time <strong class="time">142 ms</strong></span>
          </div>
        </div>

        <pre class="response">
          
        </pre>
      </section>

    </div>
  </div>

  <script src="script.js" ></script>
</body>
</html>
